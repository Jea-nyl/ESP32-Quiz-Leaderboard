<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Score Dashboard</title>
<style>
  body { font-family: Arial; background: #f0f0f0; text-align: center; padding: 50px; }
  h1 { color: #333; }
  table { margin: auto; border-collapse: collapse; width: 50%; max-width: 400px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  th, td { border: 1px solid #333; padding: 12px; text-align: center; }
  th { background: #333; color: #fff; font-size: 16px; }
  td { font-size: 14px; }
  tr:nth-child(even) { background: #f2f2f2; }
  .latest { background: #ffeb3b !important; font-weight: bold; }
</style>
</head>
<body>
<h1>Quiz Score Dashboard</h1>
<table id="leaderboard">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQ25Rc6WfzZlJh4if0esmRvuz9Iu_T3dc",
  authDomain: "esp32-guizgame.firebaseapp.com",
  databaseURL: "https://esp32-guizgame-default-rtdb.firebaseio.com",
  projectId: "esp32-guizgame",
  storageBucket: "esp32-guizgame.firebasestorage.app",
  messagingSenderId: "633925751720",
  appId: "1:633925751720:web:bed4df97e678ab3ae7c39d"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const scoresRef = ref(database, 'scores');

onValue(scoresRef, (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  const scores = [];
  for (const key in data) {
    if (data.hasOwnProperty(key)) {
      if (data[key].score === undefined || data[key].score === null) continue; // allow 0
      scores.push({ key: key, score: data[key].score });
    }
  }

  scores.sort((a,b) => b.score - a.score); // descending

  const latestKey = Object.keys(data).pop(); // latest submitted score
  const tbody = document.querySelector("#leaderboard tbody");
  tbody.innerHTML = "";

  scores.forEach((entry, idx) => {
    const tr = document.createElement("tr");
    if(entry.key === latestKey) tr.classList.add("latest");
    tr.innerHTML = `<td>${idx+1}</td><td>${entry.score}</td>`;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
